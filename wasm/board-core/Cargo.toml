[package]
name = "board-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic whiteboard geometry for MiroBoard"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
