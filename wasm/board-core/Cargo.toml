[package]
name = "board-core"
version = "0.15.0"
edition = "2021"
description = "Deterministic whiteboard geometry for MiroBoard"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
overflow-checks = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
quick-xml = "0.37"
