name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test Rust core
        run: cargo test --manifest-path wasm/board-core/Cargo.toml

      - name: Lint Rust core
        run: cargo clippy --manifest-path wasm/board-core/Cargo.toml -- -D warnings

      - name: Build WASM
        run: wasm-pack build wasm/board-core --target web --out-dir ../../src/wasm/board-core

      - name: Build application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test
