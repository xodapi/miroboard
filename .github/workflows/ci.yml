name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test Rust core
        run: cargo test --manifest-path wasm/board-core/Cargo.toml

      - name: Lint Rust core
        run: cargo clippy --manifest-path wasm/board-core/Cargo.toml -- -D warnings

      - name: Build WASM
        run: wasm-pack build wasm/board-core --target web --out-dir ../../src/wasm/board-core

      - name: Build application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test

      # The e2e suite is red on `main` already (run 32238922648, same step), so a
      # failing check on a PR carries no information on its own. Publish which
      # tests failed — as a job summary readable without downloading logs, and
      # as the HTML report artifact for local inspection.
      - name: Summarize end-to-end results
        if: always()
        run: |
          {
            echo '### Playwright results'
            echo '```'
            node scripts/summarize-playwright-report.mjs playwright-report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Run it again for the workflow commands: annotations are only parsed
          # from a step's stdout, and they are the one CI channel readable
          # without access to the log/artifact blob storage.
          node scripts/summarize-playwright-report.mjs playwright-report --annotations

      # GitHub keeps 10 annotations per level per step, so a red suite with more
      # than 10 failures needs a second step to stay fully visible.
      - name: Annotate remaining end-to-end failures
        if: always()
        run: node scripts/summarize-playwright-report.mjs playwright-report --annotations --page=2

      - name: Annotate the page state at each failure
        if: always()
        run: node scripts/summarize-playwright-report.mjs playwright-report --contexts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # TEMPORARY diagnostic job — remove once the e2e suite is green.
  #
  # The annotated run narrowed the damage to four cross-* specs that assert the
  # toolbar reads "Сохранено" after a save, and the baseline leg proved they pass
  # on the PR's base commit. So one of this branch's own commits changed
  # save-time behaviour. Rather than guess, build each candidate commit's app and
  # run the same specs against it: the first leg that turns red is the culprit.
  # Findings are reported as warnings so they never read as PR failures.
  e2e-bisect:
    name: E2E bisect (${{ matrix.leg }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: base
            sha: 6fe690db0e26a9404ba9c2adc53f3fcdfa647a86
          - leg: origins
            sha: 8220d45
          - leg: profile-multi-select
            sha: 5712ba9
          - leg: clipboard
            sha: 8aa89c5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Restore app sources at ${{ matrix.leg }}
        run: |
          git checkout "${{ matrix.sha }}" -- src
          git log -1 --format='src restored from %h %s' "${{ matrix.sha }}"

      # Build failures have to be reported through annotations too: the job log
      # that would normally explain them is not readable from a sandbox.
      - name: Build the app from ${{ matrix.leg }}
        run: |
          if ! npm run build > /tmp/build.log 2>&1; then
            tail -n 25 /tmp/build.log | tr '\n' '|' | sed -e 's/%/%25/g' -e 's/^/::error title=BISECT-${{ matrix.leg }} build failed::/'
            exit 1
          fi

      - name: Run the four failing specs
        continue-on-error: true
        run: npx playwright test tests/cross-offline-simulation-integration.spec.ts tests/cross-demo-sentence-gate.spec.ts tests/cross-file-roundtrip-journeys.spec.ts tests/cross-legacy-adoption-end-to-end.spec.ts

      - name: Report results as warnings
        if: always()
        run: |
          {
            echo "### Bisect leg: ${{ matrix.leg }} (${{ matrix.sha }})"
            echo '```'
            node scripts/summarize-playwright-report.mjs playwright-report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/summarize-playwright-report.mjs playwright-report --annotations --page=1 \
            | sed -e 's/^::error title=e2e /::warning title=BISECT-${{ matrix.leg }} e2e /' \
                  -e 's/^::notice title=Playwright/::warning title=BISECT-${{ matrix.leg }} Playwright/'
